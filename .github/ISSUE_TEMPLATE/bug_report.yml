name: Bug report
description: Report something in clawshell that isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please don't include tokens, cookies or other account data. If your report is about a security issue, use the private form in [SECURITY.md](https://github.com/mehdikhody/clawshell/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: clawshell version
      description: Shown in the app, or in `package.json`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: claude-desktop
    attributes:
      label: Claude Desktop version
      description: Found under Claude Desktop's About or Settings screen.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Accounts tab
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant log output or attach screenshots. Remove tokens and account emails first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this one isn't a duplicate.
          required: true
        - label: I'm running the latest release.
          required: true
